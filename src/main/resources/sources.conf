# Outbound source registry.
#
# This file is the complete set of hosts the service may reach. SourceGateway
# refuses any host absent from it, so an empty registry means the service makes
# no outbound requests at all.
#
# A source is added only after its terms of use and machine-readable access
# policy have been read and permit this use (tasks.md T068). Each entry records
# the date that verification was performed.
#
# Tiers govern what a source's signals may do:
#   A - official ticketing outlet, artist, venue, or promoter. May confirm a visit.
#   B - established listing service. May move a forecast. May not confirm.
#   C - forum, aggregator, speculation. May move a forecast weakly. May not confirm.

tourwatch.sources = [
  # No production source is declared yet. Each candidate needs T068 verification
  # before it appears here; shipping an unverified host would put the terms-of-use
  # decision in the code rather than in a person's hands.
  #
  # Verified entries take this shape:
  #
  # {
  #   source-id    = "example-official-events"
  #   host         = "events.example.com"
  #   tier         = "A"
  #   allowed-paths = ["/api/events"]
  #   min-request-interval-ms = 1000
  #   verified-on  = "2026-08-14"
  # }
]
