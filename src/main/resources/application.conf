# The outbound allowlist is kept in its own file so the question "what can this service
# reach?" is answered by reviewing one short document.
include "sources"

akka.javasdk.dev-mode.http-port = 9008

akka.javasdk.agent {
  # Which model backs the two agents. Override with MODEL_PROVIDER to use any of the
  # sections below without editing this file.
  model-provider = googleai-gemini
  model-provider = ${?MODEL_PROVIDER}

  # MODEL_NAME overrides the model for whichever provider is selected, so switching
  # model and switching provider are two independent decisions.

  googleai-gemini {
    provider = "googleai-gemini"
    api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    model-name = "gemini-2.5-flash"
    model-name = ${?MODEL_NAME}
  }

  anthropic {
    provider = "anthropic"
    api-key = ${?ANTHROPIC_API_KEY}
    model-name = "claude-sonnet-5"
    model-name = ${?MODEL_NAME}
  }

  openai {
    provider = "openai"
    api-key = ${?OPENAI_API_KEY}
    model-name = "gpt-4o-mini"
    model-name = ${?MODEL_NAME}
  }

  mistral-ai {
    provider = "mistral-ai"
    api-key = ${?MISTRAL_AI_API_KEY}
    # No default: set MODEL_NAME to a model this account can reach.
    model-name = ${?MODEL_NAME}
  }

  # The providers below need more than a key. The SDK reads only the api-key from the
  # environment, so the remaining fields get env fallbacks defined here.

  vertex-ai {
    provider = "vertex-ai"
    api-key = ${?VERTEX_AI_API_KEY}
    project-id = ${?VERTEX_AI_PROJECT_ID}
    location = ${?VERTEX_AI_LOCATION}
    model-name = ${?MODEL_NAME}
  }

  azure-openai {
    provider = "azure-openai"
    api-key = ${?AZURE_OPENAI_API_KEY}
    endpoint = ${?AZURE_OPENAI_ENDPOINT}
    deployment-name = ${?AZURE_OPENAI_DEPLOYMENT}
  }

  bedrock {
    provider = "bedrock"
    region = ${?AWS_REGION}
    model-id = ${?BEDROCK_MODEL_ID}
  }

  hugging-face {
    provider = "hugging-face"
    access-token = ${?HUGGING_FACE_ACCESS_TOKEN}
    model-id = ${?HUGGING_FACE_MODEL_ID}
  }

  # Local models need no key, only a reachable address.

  ollama {
    provider = "ollama"
    base-url = ${?OLLAMA_BASE_URL}
    model-name = ${?MODEL_NAME}
  }

  local-ai {
    provider = "local-ai"
    base-url = ${?LOCAL_AI_BASE_URL}
    model-name = ${?MODEL_NAME}
  }

  guardrails {
    # A narration that cites no signal cannot be traced back to anything observed,
    # so it is refused at the model boundary rather than by each call site.
    "forecast evidence" {
      class = "com.example.application.EvidenceGuardrail"
      agents = ["forecast-narrator-agent"]
      category = HALLUCINATED
      use-for = ["model-response"]
      report-only = false
    }
  }
}
